databases:
  - name: ai-purchasing-agent-db
    plan: free
    databaseName: ai_purchasing_agent
    user: ai_purchasing_agent

services:
  - type: web
    name: ai-purchasing-agent-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-purchasing-agent-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://ai-purchasing-agent-web.onrender.com

  - type: web
    name: ai-purchasing-agent-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ai-purchasing-agent-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
